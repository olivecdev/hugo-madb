<div class="toolbar sticky top-[var(--navbar-height)] z-[var(--z-index-toolbar)] flex h-[var(--toolbar-height)] items-center bg-[var(--toolbar-background)] text-[var(--toolbar-font-color)]" role="navigation">
  {{ partial "nav-toggle" . }}
  <a href="{{ .Site.Home.RelPermalink }}" class="home-link{{ if .IsHome }} is-current{{ end }}" title="Home">
    <i class="fa fa-home"></i>
  </a>
  {{ partial "breadcrumbs" . }}
  {{ $scratch := newScratch }}
  {{ with .File }}
  {{ with .Path }}
  {{ $scratch.Set "filePath" . }}
  {{ end }}
  {{ end }}
  {{ with .Site.Params.editThisPage }}
  {{ if $scratch.Get "filePath" }}
  <div class="edit-this-page"><a href="{{ . }}{{ $scratch.Get " filePath" }}">{{ i18n "editThisPage" }}</a></div>
  {{ end }}
  {{ end }}
</div>
