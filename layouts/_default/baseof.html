<!DOCTYPE html>
<html{{ with .Language.Lang }} lang="{{ . }}" {{ end }} data-theme="light">

  <head>
    {{ partial "head.html" . }}
  </head>

  <body class="article pt-[var(--navbar-height)]">
    {{ partial "body-scripts.html" . }}
    {{ partial "header.html" . }}
    <div class="body lg:flex">
      {{ partial "nav.html" . }}
      <main class="article w-full">
        {{ partial "toolbar.html" . }}
        <div class="content mx-auto flex w-full max-w-[var(--doc-max-inline-size)] overflow-x-auto px-4">
          {{ block "main" . }}
          {{ end }}
        </div>
      </main>
    </div>
    {{ partial "footer.html" . }}
  </body>

  </html>
